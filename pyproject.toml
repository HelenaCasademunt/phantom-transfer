[project]
name = "phantom-transfer"
version = "0.1.0"
description = "Phantom transfer: generating, filtering, and studying trait-poisoned SFT data"
requires-python = ">=3.10,<3.13"
dependencies = [
    "vllm>=0.10.0",
    "transformers>=4.51",
    "peft>=0.10.0",
    "trl>=0.19",
    "accelerate>=0.30.0",
    "scikit-learn>=1.5",
    "numpy",
    "aiohttp",
    "anthropic",
    "openai",
    "pydantic",
    "tqdm",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
